<style>
/* Layout concept: a pegboard workshop. Sticky toolbar with XP, one focused card at a time, repair jobs arrive as work-order tickets. */
:root{
 --bg:#E9EDF0;--dot:rgba(46,94,126,.17);--panel:#fff;--panel2:#F2F5F7;--ink:#16242E;--muted:#51636F;--line:#C9D4DB;
 --steel:#2E5E7E;--steel-soft:#DCE9F1;--head-bg:#234B66;--head-ink:#fff;
 --accent:#C9490B;--accent-soft:#FDE7DA;--on-accent:#fff;
 --good:#1B7A3D;--good-soft:#DDF3E4;--bad:#B42318;--bad-soft:#FCE2DF;--star:#F0A81B;
 --f-display:'Barlow Condensed','Arial Narrow',sans-serif;--f-body:'Atkinson Hyperlegible',system-ui,sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#11191F;--dot:rgba(127,180,214,.13);--panel:#1A252D;--panel2:#222F39;--ink:#E8EFF3;--muted:#9DB0BC;--line:#34444F;
 --steel:#7FB4D6;--steel-soft:#213644;--head-bg:#2B4A5E;--head-ink:#E8EFF3;
 --accent:#FF8A4C;--accent-soft:#3F2415;--on-accent:#1B0E05;
 --good:#5FD08A;--good-soft:#17382A;--bad:#FF8A80;--bad-soft:#3E1E1C;--star:#F5B83A;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#11191F;--dot:rgba(127,180,214,.13);--panel:#1A252D;--panel2:#222F39;--ink:#E8EFF3;--muted:#9DB0BC;--line:#34444F;
 --steel:#7FB4D6;--steel-soft:#213644;--head-bg:#2B4A5E;--head-ink:#E8EFF3;
 --accent:#FF8A4C;--accent-soft:#3F2415;--on-accent:#1B0E05;
 --good:#5FD08A;--good-soft:#17382A;--bad:#FF8A80;--bad-soft:#3E1E1C;--star:#F5B83A;color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.7px);background-size:22px 22px;color:var(--ink);font:17px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.inner{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.02em;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2.3rem}h2{font-size:1.7rem}h3{font-size:1.3rem}
p{margin:0}
button{font-family:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar .inner{padding-block:8px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font:700 1.35rem var(--f-display);text-transform:uppercase;letter-spacing:.03em;color:var(--steel)}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.chip-h{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:14px;white-space:nowrap}
.chip-h svg{color:var(--accent)}
.xprow{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:13px;color:var(--muted)}
.xpbar{flex:1;height:7px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.xpfill{height:100%;width:0;background:var(--accent);transition:width .5s}
.main{padding-block:20px 90px}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tab{flex:1;min-width:0;padding:10px 6px;border:2px solid var(--line);border-radius:12px;background:var(--panel);font:700 1.05rem var(--f-display);text-transform:uppercase;letter-spacing:.03em;cursor:pointer}
.tab.on{background:var(--steel);border-color:var(--steel);color:var(--panel)}
.tab small{font:500 11px var(--f-mono);display:block;opacity:.8}
.intro{margin-bottom:14px;display:grid;gap:6px}
.intro p{color:var(--muted)}
.subnav{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.sub{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:2px solid var(--line);background:var(--panel);font-weight:700;font-size:14px;cursor:pointer}
.sub.on{border-color:var(--accent);background:var(--accent-soft)}
.subn{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--steel-soft);color:var(--steel);font:700 12px var(--f-mono)}
.sub.done .subn{background:var(--good);color:var(--panel)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 20px -14px rgba(22,36,46,.5);display:grid;gap:14px}
.lead{color:var(--muted)}
.btn{font:700 16px/1 var(--f-body);padding:13px 18px;min-height:46px;border-radius:10px;border:2px solid var(--ink);background:var(--panel);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{padding:8px 12px;min-height:36px;font-size:14px}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.ico{display:block}
/* word wall */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-items:start}
.wcard{border:2px solid var(--line);border-radius:14px;background:var(--panel2);min-width:0}
.wcard.open{grid-column:1/-1;background:var(--panel);border-color:var(--steel)}
.wcard.verb.open{border-color:var(--accent)}
.whead{width:100%;display:flex;align-items:center;gap:10px;padding:10px;background:none;border:0;cursor:pointer;text-align:left;color:var(--steel)}
.wcard.verb .whead{color:var(--accent)}
.wword{font:700 1.2rem var(--f-display);text-transform:uppercase;letter-spacing:.03em;color:var(--ink);overflow-wrap:anywhere}
.vtag{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;border:2px dashed currentColor;font:500 11px var(--f-mono);text-transform:uppercase}
.seen-dot{margin-left:auto;width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.wcard.seen .seen-dot{background:var(--good)}
.wbody{padding:0 12px 12px;display:grid;gap:6px}
.wex{font-style:italic;color:var(--muted)}.walt{font:500 12px var(--f-mono);color:var(--muted)}
/* match */
.mgrid{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}
.mcol{display:grid;gap:8px;align-content:start;min-width:0}
.mitem,.mdef{text-align:left;padding:11px 12px;border:2px solid var(--line);border-radius:12px;background:var(--panel2);cursor:pointer;font-size:15.5px;min-width:0;overflow-wrap:anywhere}
.mitem{font-weight:700}
.mitem.sel{border-color:var(--accent);background:var(--accent-soft)}
.mitem.ok,.mdef.ok{border-color:var(--good);background:var(--good-soft);cursor:default}
/* gap fill */
.bank{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border-radius:12px;background:var(--panel2);border:1px dashed var(--line)}
.chip{padding:8px 14px;border-radius:999px;border:2px solid var(--steel);background:var(--panel);font-weight:700;cursor:pointer}
.chip.sel{background:var(--steel);color:var(--panel)}
.chip.used{opacity:.3;cursor:default}
.sents{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.sent{line-height:2.3}
.gap{min-width:96px;padding:3px 10px;margin:0 3px;border-radius:8px;border:2px dashed var(--steel);background:var(--steel-soft);font-weight:700;cursor:pointer;min-height:34px}
.gap.filled{border-style:solid}.gap.active{border-color:var(--accent);background:var(--accent-soft)}
.gap.ok{border-color:var(--good);background:var(--good-soft);cursor:default}
.gap.bad,.oslot.bad{border-color:var(--bad);background:var(--bad-soft)}
.msg{font-weight:700;color:var(--muted)}
/* spell */
.clue{display:flex;gap:14px;align-items:center;padding:14px;border-radius:12px;background:var(--panel2);color:var(--steel)}
.clue p{color:var(--ink)}
.slots,.tiles{display:flex;gap:6px;flex-wrap:wrap}
.slotgrp{display:flex;gap:5px;margin-right:14px}
.slot,.tile{width:40px;height:46px;border-radius:9px;border:2px solid var(--steel);background:var(--panel);font:700 1.4rem var(--f-display);text-transform:uppercase;cursor:pointer;padding:0}
.slot{background:var(--panel2);border-style:dashed}.slot.f{border-style:solid;background:var(--panel)}
.slot.lock{border-color:var(--accent);cursor:default}.slot.bad{border-color:var(--bad);background:var(--bad-soft)}
.slot.ok{border-color:var(--good);background:var(--good-soft)}
.tile.used{opacity:.2;cursor:default}
/* jobs */
.rail{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;margin-bottom:14px}
.rn{height:34px;border-radius:8px;border:2px solid var(--line);background:var(--panel);font:700 13px var(--f-mono);cursor:pointer;padding:0}
.rn.done{background:var(--steel);border-color:var(--steel);color:var(--panel)}
.rn.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.stack{display:grid;gap:14px}
.job{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 8px 20px -14px rgba(22,36,46,.5)}
.jobhead{display:flex;justify-content:space-between;padding:8px 16px;background:var(--head-bg);color:var(--head-ink)}
.jobbody{padding:16px;display:grid;gap:12px;border-bottom:2px dashed var(--line)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0}
.fields dt{font:500 11px var(--f-mono);text-transform:uppercase;color:var(--muted);letter-spacing:.08em}
.fields dd{margin:0;font-weight:700}
.pri{padding:2px 10px;border-radius:999px;font-size:13px;background:var(--steel-soft);color:var(--steel)}
.pri.Urgent{background:var(--accent-soft);color:var(--accent)}.pri.Safety{background:var(--bad-soft);color:var(--bad)}
.quote{margin:0;padding:10px 14px;border-radius:12px;background:var(--panel2);font-style:italic}
.quote::before{content:"“";font:700 2rem/0 var(--f-display);color:var(--accent);margin-right:4px;vertical-align:-8px}
.think{padding:12px 16px;display:flex;gap:10px;align-items:baseline;background:var(--accent-soft);border-radius:0 0 14px 14px}
.think b{font:500 12px var(--f-mono);text-transform:uppercase;color:var(--accent);letter-spacing:.08em;white-space:nowrap}
.step{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.stepn{display:block;font:500 12px var(--f-mono);color:var(--accent);letter-spacing:.08em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;background:var(--panel);border:2px solid var(--line);border-radius:14px;cursor:pointer;text-align:center;color:var(--steel)}
.opt b{color:var(--ink);font:700 1.1rem var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.opt.good,.copt.good{border-color:var(--good);background:var(--good-soft)}
.opt.bad,.copt.bad{border-color:var(--bad);background:var(--bad-soft)}
.why{font-size:14.5px;color:var(--ink);text-align:left;font-style:normal;display:block;margin-top:4px}
.copt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer}
.cl{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--steel-soft);color:var(--steel);font:700 13px var(--f-mono)}
.ct{min-width:0}
.hint{padding:10px 14px;border-radius:10px;background:var(--steel-soft);font-size:15px}
.olist{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.oslot,.ostep{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 12px;border-radius:12px;border:2px dashed var(--line);background:var(--panel2);cursor:pointer;color:var(--muted)}
.oslot.filled{border-style:solid;border-color:var(--steel);background:var(--panel);color:var(--ink)}
.oslot.ok{border-color:var(--good);background:var(--good-soft);color:var(--ink);cursor:default}
.onum{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--steel);color:var(--panel);font:700 13px var(--f-mono)}
.ostep{border:2px solid var(--steel);border-style:solid;background:var(--panel);color:var(--ink)}
.pool{display:grid;gap:8px}
.explain{padding:12px 14px;border-radius:12px;background:var(--good-soft);border:1px solid var(--good)}
.debrief{background:var(--panel);border:2px solid var(--good);border-radius:16px;padding:18px;display:grid;gap:12px}
.stars{display:flex;gap:4px}.stars svg{width:30px;height:30px}
.star{fill:none;stroke:var(--line);stroke-width:2}.star.on{fill:var(--star);stroke:var(--ink);animation:pop .5s both}
.say{padding:12px 14px;border-radius:12px;background:var(--steel-soft);display:grid;gap:8px}
/* results */
.rank{text-align:center;display:grid;gap:8px;padding:10px 0}
.rank h2{font-size:2.6rem;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:12px;border-radius:12px;background:var(--panel2);text-align:center}
.stat b{display:block;font:700 1.8rem var(--f-display)}
.pegs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.peg{display:grid;justify-items:center;gap:4px;padding:10px 4px;border-radius:12px;border:2px dashed var(--line);color:var(--muted);font-size:12px;text-align:center}
.peg.on{border:2px solid var(--steel);color:var(--steel);background:var(--panel)}
.peg .stars svg{width:14px;height:14px}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.badge{padding:12px;border-radius:12px;border:2px dashed var(--line);color:var(--muted);display:grid;gap:2px}
.badge b{font:700 1.1rem var(--f-display);text-transform:uppercase}
.badge.on{border:2px solid var(--accent);background:var(--accent-soft);color:var(--ink)}
.badge.on b{color:var(--accent)}
.talk{margin:0;padding-left:20px;display:grid;gap:6px}
#toasts{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom,0px));display:grid;gap:6px;justify-items:center;pointer-events:none;z-index:20}
.toast{padding:8px 16px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;animation:rise .3s both}
.toast.level{background:var(--accent);color:var(--on-accent)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){h1{font-size:1.9rem}.mgrid{grid-template-columns:1fr 1.3fr}.slot,.tile{width:34px;height:42px}}
</style>

var G,W,C,view,pendingScroll=null;
function newMatch(){return {round:0,sel:null,matched:{},mist:{},roundMist:false,flash:[],orders:ROUNDS.map(function(r){return shuffle(r)})}}
function reset(){
 G={xp:0,streak:0,best:0,hints:0};
 W={step:0,done:[false,false,false,false],opened:{},nOpened:0,open:null,match:newMatch(),
  fill:gapNew(FILL.map(function(f){return {t:f.t,a:[f.a]}}),FILL.map(function(f){return f.a})),spell:{i:0,cur:null,fin:false}};
 C={i:0,r:[]};view='warm';
}
function lvl(){var k=0;LEVELS.forEach(function(l,j){if(G.xp>=l.at)k=j});return k}
function renderHUD(){
 var k=lvl(),L=LEVELS[k],N=LEVELS[k+1];
 $('#hud-level').textContent=L.n;$('#hud-xp').textContent=G.xp;$('#hud-streak').textContent=G.streak;
 $('#xpfill').style.width=(N?Math.min(100,(G.xp-L.at)/(N.at-L.at)*100):100)+'%';
 $('#xpnext').textContent=N?(N.at-G.xp)+' XP to '+N.n:'Top level!';
}
function toast(msg,kind){
 var box=$('#toasts'),d=document.createElement('div');d.className='toast '+(kind||'');d.textContent=msg;box.appendChild(d);
 while(box.children.length>3)box.removeChild(box.firstChild);
 setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d)},1800);
}
function addXP(n,silent){
 var before=lvl();G.xp=Math.max(0,G.xp+n);
 if(!silent&&n)toast((n>0?'+':'−')+Math.abs(n)+' XP');
 if(lvl()>before)toast('Level up! You are a '+LEVELS[lvl()].n,'level');
 renderHUD();
}
function tick(){G.streak++;G.best=Math.max(G.best,G.streak);if(G.streak>=3){addXP(3,true);toast('Streak x'+G.streak+'! +3 XP','level')}}
function brk(){G.streak=0}

/* ---------- gap-fill component ---------- */
function gapNew(sentences,bank){
 var gaps=[];sentences.forEach(function(s,si){s.a.forEach(function(a){gaps.push({si:si,a:a,chip:null,locked:false})})});
 return {sentences:sentences,gaps:gaps,chips:shuffle(bank.map(function(w,id){return {id:id,w:w}})),sel:null,active:null,checks:0,flash:[],msg:'',done:false};
}
function gapRender(g,key){
 var gi=0;
 var list=g.sentences.map(function(s){
  var parts=s.t.split('___'),out='';
  parts.forEach(function(p,pi){
   out+=esc(p);
   if(pi<parts.length-1){
    var idx=gi++,gap=g.gaps[idx],chip=gap.chip!==null?g.chips.filter(function(c){return c.id===gap.chip})[0]:null;
    out+='<button class="gap'+(gap.locked?' ok':'')+(chip?' filled':'')+(g.active===idx?' active':'')+(g.flash.indexOf(idx)>-1?' shake bad':'')+'" data-act="gapclick" data-g="'+key+'" data-i="'+idx+'">'+(chip?esc(chip.w):'&nbsp;')+'</button>';
   }
  });
  return '<li class="sent">'+out+'</li>';
 }).join('');
 var used={};g.gaps.forEach(function(x){if(x.chip!==null)used[x.chip]=1});
 var bank=g.chips.map(function(c){return '<button class="chip'+(used[c.id]?' used':'')+(g.sel===c.id?' sel':'')+'" data-act="gapchip" data-g="'+key+'" data-id="'+c.id+'"'+(used[c.id]?' disabled':'')+'>'+esc(c.w)+'</button>'}).join('');
 var full=g.gaps.every(function(x){return x.chip!==null});
 g.flash=[];
 return '<div class="bank" aria-label="Word bank">'+bank+'</div><ol class="sents">'+list+'</ol>'+
  (g.done?'':'<div class="row"><button class="btn primary" data-act="gapcheck" data-g="'+key+'"'+(full?'':' disabled')+'>Check</button><span class="msg">'+esc(g.msg)+'</span></div>');
}
function gapCheck(g){
 var first=g.checks===0,right=0,wrong=0;g.checks++;g.flash=[];g.sel=null;
 g.gaps.forEach(function(gap,i){
  if(gap.locked||gap.chip===null)return;
  var chip=g.chips.filter(function(c){return c.id===gap.chip})[0];
  if(chip.w===gap.a){gap.locked=true;right++}else{gap.chip=null;wrong++;g.flash.push(i)}
 });
 g.done=g.gaps.every(function(x){return x.locked});
 g.msg=g.done?'All correct!':right+' correct. Fix the red gaps.';
 return {first:first,right:right,wrong:wrong,done:g.done};
}
function gapChip(g,id){
 if(g.done)return;
 var a=g.active!==null?g.gaps[g.active]:null;
 if(a&&a.chip===null&&!a.locked){a.chip=id;g.active=null;g.sel=null}else g.sel=(g.sel===id)?null:id;
}
function gapClick(g,i){
 var gap=g.gaps[i];if(gap.locked||g.done)return;
 if(g.sel!==null){gap.chip=g.sel;g.sel=null;g.active=null}
 else if(gap.chip!==null)gap.chip=null;
 else g.active=(g.active===i)?null:i;
}

/* ---------- order component ---------- */
function ordNew(steps){
 var items=steps.map(function(t,i){return {id:i,t:t}}),sh;
 do{sh=shuffle(items)}while(sh.every(function(x,i){return x.id===i}));
 return {items:sh,slots:steps.map(function(){return null}),locked:steps.map(function(){return false}),flash:[],checks:0,done:false,msg:''};
}
function ordRender(o){
 var used={};o.slots.forEach(function(x){if(x!==null)used[x]=1});
 var slots=o.slots.map(function(id,i){
  var it=id!==null?o.items.filter(function(x){return x.id===id})[0]:null;
  return '<li><button class="oslot'+(it?' filled':'')+(o.locked[i]?' ok':'')+(o.flash.indexOf(i)>-1?' shake bad':'')+'" data-act="oslot" data-i="'+i+'"><span class="onum">'+(i+1)+'</span><span>'+(it?esc(it.t):'Tap a step below')+'</span></button></li>';
 }).join('');
 var pool=o.items.filter(function(x){return !used[x.id]}).map(function(x){return '<button class="ostep" data-act="ostep" data-id="'+x.id+'">'+esc(x.t)+'</button>'}).join('');
 var full=o.slots.every(function(x){return x!==null});
 o.flash=[];
 return '<ol class="olist">'+slots+'</ol>'+(o.done?'':'<div class="pool">'+pool+'</div><div class="row"><button class="btn primary" data-act="ocheck"'+(full?'':' disabled')+'>Check</button><span class="msg">'+esc(o.msg)+'</span></div>');
}
function ordCheck(o){
 var first=o.checks===0,wrong=0;o.checks++;o.flash=[];
 o.slots.forEach(function(id,i){
  if(o.locked[i]||id===null)return;
  if(id===i)o.locked[i]=true;else{o.slots[i]=null;o.flash.push(i);wrong++}
 });
 o.done=o.locked.every(Boolean);
 o.msg=o.done?'Perfect order!':'Some steps are in the wrong place. Try again.';
 return {first:first,wrong:wrong,done:o.done};
}

   (open?'<div class="wbody"><p>'+esc(v.d)+'</p><p class="wex">“'+esc(v.e)+'”</p>'+(v.alt?'<p class="walt">'+esc(v.alt)+'</p>':'')+(SPEAK?'<div><button class="btn small" data-act="speak" data-i="'+i+'">Listen</button></div>':'')+'</div>':'')+'</div>';
 }).join('');
 return '<p class="lead">Tap a card. Read the meaning. Listen and say the word. <b>'+W.nOpened+' / 20</b> words seen.</p><div class="wgrid">'+cards+'</div>'+
  '<div class="row"><span></span><button class="btn primary" data-act="wstep" data-i="1">Next: Match</button></div>';
}
function panelMatch(){
 var m=W.match,ids=ROUNDS[m.round],fl=m.flash||[];
 var left=ids.map(function(i){var ok=m.matched[i];return '<button class="mitem'+(ok?' ok':'')+(m.sel===i?' sel':'')+(fl[0]===i?' shake bad':'')+'" data-act="mL" data-i="'+i+'"'+(ok?' disabled':'')+'>'+esc(V[i].w)+(ok?' '+CHECK:'')+'</button>'}).join('');
 var right=m.orders[m.round].map(function(i){var ok=m.matched[i];return '<button class="mdef'+(ok?' ok':'')+(fl[1]===i?' shake bad':'')+'" data-act="mR" data-i="'+i+'"'+(ok?' disabled':'')+'>'+esc(V[i].d)+'</button>'}).join('');
 m.flash=[];
 var complete=ids.every(function(i){return m.matched[i]});
 var last=m.round===ROUNDS.length-1;
 return '<div class="row"><h3>Round '+(m.round+1)+' / 4 · '+(m.round<2?'Tools':'Verbs')+'</h3></div><p class="lead">Tap a word. Then tap its meaning.</p>'+
  '<div class="mgrid"><div class="mcol">'+left+'</div><div class="mcol">'+right+'</div></div>'+
  (complete?'<div class="row"><b>Round complete!</b><button class="btn primary" data-act="mnext">'+(last?'Next: Fill the gaps':'Next round')+'</button></div>':'');
}
function panelFill(){
 var g=W.fill;
 return '<p class="lead">Tap a word in the bank. Then tap a gap. Press Check.</p>'+gapRender(g,'fill')+
  (g.done?'<div class="row"><b>All 10 correct!</b><button class="btn primary" data-act="wstep" data-i="3">Next: Spell it</button></div>':'');
}
function spellInit(i){
 var word=SPELL[i],letters=word.replace(/ /g,'').split(''),tiles=letters.map(function(c,id){return {id:id,c:c}}),sh,n=0;
 do{sh=shuffle(tiles);n++}while(n<20&&sh.map(function(t){return t.c}).join('')===letters.join(''));
 return {word:word,tiles:sh,slots:letters.map(function(){return null}),locked:letters.map(function(){return false}),tries:0,hint:false,solved:false,flash:false};
}
function panelSpell(){
 var S=W.spell;
 if(S.fin)return '<div class="rank"><h2>Warm-up complete</h2><p class="lead">You know the 20 words. Now solve 12 repair jobs.</p></div><div class="row" style="justify-content:center"><button class="btn primary" data-act="tab" data-v="chal">Start the repair jobs</button></div>';
 if(!S.cur)S.cur=spellInit(S.i);
 var c=S.cur,v=V[VI[c.word]],used={};
 c.slots.forEach(function(x){if(x!==null)used[x]=1});
 var pos=0,groups=c.word.split(' ').map(function(w){
  var s='';for(var k=0;k<w.length;k++){var idx=pos++,id=c.slots[idx],t=id!==null?c.tiles.filter(function(x){return x.id===id})[0]:null;
   s+='<button class="slot'+(t?' f':'')+(c.locked[idx]?' lock':'')+(c.solved?' ok':'')+(c.flash&&!c.locked[idx]?' shake bad':'')+'" data-act="sslot" data-i="'+idx+'" aria-label="Letter '+(idx+1)+'">'+(t?esc(t.c):'')+'</button>'}
  return '<div class="slotgrp">'+s+'</div>';}).join('');
 c.flash=false;
 var tiles=c.tiles.map(function(t){return '<button class="tile'+(used[t.id]?' used':'')+'" data-act="stile" data-id="'+t.id+'"'+(used[t.id]?' disabled':'')+'>'+esc(t.c)+'</button>'}).join('');
 return '<div class="row"><h3>Word '+(S.i+1)+' / 10</h3><span class="chip-h">'+(v.t==='tool'?'Tool':'Verb')+'</span></div>'+
  '<div class="clue">'+(v.t==='tool'?icon(v.k,52):'')+'<p>'+esc(v.d)+'</p></div>'+
  '<div class="slots" aria-label="Your answer">'+groups+'</div>'+(c.solved?'':'<div class="tiles">'+tiles+'</div>')+
  (c.solved?'<div class="row"><b>Yes! '+esc(c.word)+'</b><button class="btn primary" data-act="snext">'+(S.i===9?'Finish warm-up':'Next word')+'</button></div>'
   :'<div class="row"><button class="btn small ghost" data-act="shint"'+(c.hint?' disabled':'')+'>First letter (less XP)</button><button class="btn small ghost" data-act="sclear">Clear</button></div>');
}
function viewWarm(){
 var names=['Words','Match','Fill the gaps','Spell it'];
 var nav=names.map(function(n,i){return '<button class="sub'+(W.step===i?' on':'')+(W.done[i]?' done':'')+'" data-act="wstep" data-i="'+i+'"><span class="subn">'+(W.done[i]?CHECK:i+1)+'</span>'+n+'</button>'}).join('');
 var body=[panelWords,panelMatch,panelFill,panelSpell][W.step]();
 return '<div class="intro"><h1>Warm up your words</h1><p>20 words for tools and actions. Then solve 12 repair jobs. Win XP and become a Master Mechanic.</p></div><nav class="subnav" id="subnav">'+nav+'</nav><section class="panel" id="panel">'+body+'</section>';
}

/* ---------- repair jobs ---------- */
function ensureRes(i){
 if(!C.r[i]){
  var sc=SC[i];
  C.r[i]={q1:{wrong:0,hint:false,picked:[],done:false},q2:{wrong:0,hint:false,picked:[],done:false,g:null,o:null,opts:null},xp:0,done:false,stars:0,opts:shuffle(sc.o)};
  if(sc.t2==='gap')C.r[i].q2.g=gapNew(sc.gap.s,sc.gap.b);
  if(sc.t2==='order')C.r[i].q2.o=ordNew(sc.steps);
  if(sc.t2==='choice')C.r[i].q2.opts=shuffle(sc.c);
 }
 return C.r[i];
}
function curRes(){return ensureRes(C.i)}
function gain(r,n){addXP(n);r.xp+=n}
function finishJob(r){
 r.done=true;
 var pen=r.q1.wrong+r.q2.wrong+(r.q1.hint?1:0)+(r.q2.hint?1:0);
 r.stars=pen===0?3:pen<=2?2:1;
 pendingScroll='#debrief';
}
function award(r,q){
 var w=r[q].wrong,base=w===0?20:w===1?10:5;
 r[q].done=true;gain(r,base);
 if(w===0)tick();
 if(q==='q1')pendingScroll='#q2';else finishJob(r);
}
function hintBtn(r,q){
 if(r[q].done)return '';
 if(r[q].hint)return '<div class="hint"><b>Hint:</b> '+esc(SC[C.i][q==='q1'?'h1':'h2'])+'</div>';
 return '<div><button class="btn small ghost" data-act="hint" data-q="'+q+'">Need a hint? −5 XP</button></div>';
}
function viewChal(){
 var i=C.i,sc=SC[i],r=ensureRes(i);
 var rail=SC.map(function(s,j){var rr=C.r[j];return '<button class="rn'+(j===i?' cur':'')+(rr&&rr.done?' done':'')+'" data-act="goto" data-i="'+j+'" aria-label="Job '+(j+1)+'">'+(j+1)+'</button>'}).join('');
 var opts=r.opts.map(function(o){
  var picked=r.q1.picked.indexOf(o.k)>-1,st=picked?(o.ok?' good':' bad'):'',show=picked||r.q1.done;
  return '<button class="opt'+st+'" data-act="pick1" data-t="'+o.k+'"'+((r.q1.done||picked)?' disabled':'')+'>'+icon(o.k,46)+'<b>'+esc(V[VI[o.k==='gauge'?'pressure gauge':o.k==='leads'?'jump leads':o.k]].w)+'</b>'+(show?'<span class="why">'+esc(o.w)+'</span>':'')+'</button>';
 }).join('');
 var q2='';
 if(r.q1.done){
  var body='';
  if(sc.t2==='choice'){
   body='<div class="stack" style="gap:8px">'+r.q2.opts.map(function(o,j){
    var picked=r.q2.picked.indexOf(j)>-1,st=picked?(o.ok?' good':' bad'):'',show=picked||r.q2.done;
    return '<button class="copt'+st+'" data-act="pick2" data-i="'+j+'"'+((r.q2.done||picked)?' disabled':'')+'><span class="cl">'+'ABC'.charAt(j)+'</span><span class="ct">'+esc(o.t)+(show?'<span class="why">'+esc(o.w)+'</span>':'')+'</span></button>';
   }).join('')+'</div>';
  }else if(sc.t2==='order'){body=ordRender(r.q2.o)}
  else{body=gapRender(r.q2.g,'sc')}
  q2='<section class="step" id="q2"><h3><span class="stepn">STEP 2</span>'+esc(sc.q2)+'</h3>'+body+hintBtn(r,'q2')+
   (r.q2.done&&sc.why2?'<div class="explain"><b>Why?</b> '+esc(sc.why2)+'</div>':'')+'</section>';
 }
 var deb='';
 if(r.done){
  var last=i===SC.length-1;
  deb='<section class="debrief" id="debrief"><div class="row"><h3>Job done!</h3>'+starsHTML(r.stars)+'</div><p><b>'+r.xp+' XP</b> earned on this job.</p>'+
   '<div class="say"><span class="mono">Say it out loud</span><p>“'+esc(sc.model)+'”</p>'+(SPEAK?'<div><button class="btn small" data-act="speakm">Listen</button></div>':'')+'<p class="lead">Now say it in your own words to your partner.</p></div>'+
   '<div class="row"><span></span><button class="btn primary" data-act="next">'+(last?'See my results':'Next job')+'</button></div></section>';
 }
 return '<div class="rail" role="navigation" aria-label="Jobs">'+rail+'</div>'+
  '<div class="stack"><article class="job"><header class="jobhead mono"><span>Work order</span><span>#'+(1040+i+1)+(i===SC.length-1?' · Final job':'')+'</span></header>'+
  '<div class="jobbody"><h2>'+esc(sc.title)+'</h2><dl class="fields"><div><dt>Vehicle</dt><dd>'+esc(sc.car)+'</dd></div><div><dt>Customer</dt><dd>'+esc(sc.cust)+'</dd></div><div><dt>Priority</dt><dd><span class="pri '+sc.pri+'">'+(sc.pri==='Safety'?'Safety first':sc.pri)+'</span></dd></div></dl>'+
  '<p>'+esc(sc.sit)+'</p><blockquote class="quote">'+esc(sc.quote)+'</blockquote></div>'+
  '<div class="think"><b>Think first</b><span>'+esc(sc.think)+'</span></div></article>'+
  '<section class="step" id="q1"><h3><span class="stepn">STEP 1</span>'+esc(sc.q1)+'</h3><div class="opts">'+opts+'</div>'+hintBtn(r,'q1')+'</section>'+
  q2+deb+'</div>';
}

/* ---------- results ---------- */
function viewRes(){
 var done=C.r.filter(function(r){return r&&r.done}).length;
 var stars=C.r.reduce(function(a,r){return a+(r&&r.done?r.stars:0)},0);
 var three=C.r.filter(function(r){return r&&r.done&&r.stars===3}).length;
 try{var b=+localStorage.getItem('we_best')||0;if(G.xp>b)localStorage.setItem('we_best',G.xp)}catch(e){}
 function clean(j){var r=C.r[j];return !!(r&&r.done&&r.q1.wrong+r.q2.wrong===0)}
 var badges=[
  {n:'Word Wizard',d:'Finish all 4 warm-up steps',ok:W.done.every(Boolean)},
  {n:'Toolbox Full',d:'Finish all 12 jobs',ok:done===12},
  {n:'Safety First',d:'Jobs 3, 8 and 12 right first time',ok:clean(2)&&clean(7)&&clean(11)},
  {n:'No Hints',d:'All 12 jobs without a hint',ok:done===12&&G.hints===0},
  {n:'Triple Star',d:'3 stars on 8 or more jobs',ok:three>=8}];
 var pegs=SC.map(function(s,j){var r=C.r[j],ok=r&&r.done;
  return '<div class="peg'+(ok?' on':'')+'">'+(ok?icon(s.tool,34):'<span class="mono">'+(j+1)+'</span>')+'<span>'+esc(s.title)+'</span>'+(ok?starsHTML(r.stars):'')+'</div>'}).join('');
 return '<div class="panel"><div class="rank"><span class="mono">Your rank</span><h2>'+LEVELS[lvl()].n+'</h2></div>'+
  '<div class="stats"><div class="stat"><b>'+G.xp+'</b>XP</div><div class="stat"><b>'+done+' / 12</b>Jobs done</div><div class="stat"><b>'+stars+' / 36</b>Stars</div></div>'+
  '<h3>Your toolbox</h3><div class="pegs">'+pegs+'</div>'+
  '<h3>Badges</h3><div class="badges">'+badges.map(function(x){return '<div class="badge'+(x.ok?' on':'')+'"><b>'+x.n+'</b><span>'+x.d+'</span></div>'}).join('')+'</div>'+
  '<h3>Talk to your partner</h3><ol class="talk"><li>Which job was the most dangerous? Why?</li><li>Tell me about a problem at your work. Which tool do you use?</li><li>How do you change a wheel? Use: first, then, after that, finally.</li></ol>'+
  '<div class="row"><button class="btn" data-act="tab" data-v="chal">Back to jobs</button><button class="btn primary" data-act="again">Play again</button></div></div>';
}

/* ---------- render + events ---------- */
function keyOf(e){return ['act','i','id','g','t','q'].map(function(k){return e.dataset[k]||''}).join('|')}
function render(){
 renderHUD();
 var tabs=[['warm','Warm-up','20 words'],['chal','Repair jobs','12 jobs'],['res','Results','Your rank']];
 $('#tabs').innerHTML=tabs.map(function(t,i){return '<button class="tab'+(view===t[0]?' on':'')+'" data-act="tab" data-v="'+t[0]+'"><small>'+(i+1)+'</small>'+t[1]+'</button>'}).join('');
 var a=document.activeElement,fk=(a&&a.dataset&&a.dataset.act)?keyOf(a):null;
 $('#app').innerHTML=view==='warm'?viewWarm():view==='chal'?viewChal():viewRes();
 if(fk){var el=$$('[data-act]').filter(function(e){return keyOf(e)===fk})[0];if(el&&!el.disabled)el.focus({preventScroll:true})}
 if(pendingScroll){var t=$(pendingScroll);pendingScroll=null;if(t)t.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'})}
}
function go(v,sel){view=v;pendingScroll=sel||'.tabs';render()}
function getG(k){return k==='fill'?W.fill:curRes().q2.g}
function placeTile(c,id){
 var idx=c.slots.findIndex(function(x,i){return x===null&&!c.locked[i]});
 if(idx>-1)c.slots[idx]=id;
}
function spellCheck(c){
 var g=c.slots.map(function(id){return c.tiles.filter(function(t){return t.id===id})[0].c}).join('');
 if(g===c.word.replace(/ /g,'')){
  c.solved=true;var base=(c.tries===0&&!c.hint)?10:5;addXP(base);if(base===10)tick();
 }else{c.tries++;c.flash=true;if(c.tries===1)brk();toast('Not yet. Try again.')}
}
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 var d=b.dataset,i=+d.i,r;
 switch(d.act){
 case 'tab':go(d.v);return;
 case 'again':reset();go('warm');return;
 case 'wstep':W.step=i;pendingScroll='#subnav';break;
 case 'wopen':W.open=W.open===i?null:i;
  if(!W.opened[i]){W.opened[i]=1;W.nOpened++;addXP(1,true);if(W.nOpened===20&&!W.done[0]){W.done[0]=true;toast('All 20 words seen!')}}break;
 case 'speak':speak(V[i].w+'. '+V[i].e);return;
 case 'speakm':speak(SC[C.i].model);return;
 case 'mL':if(!W.match.matched[i])W.match.sel=i;break;
 case 'mR':{var m=W.match;if(m.matched[i])break;
  if(m.sel===null){toast('Tap a word first');return}
  if(m.sel===i){var cl=!m.mist[i];m.matched[i]=1;addXP(cl?5:2);m.sel=null;
   if(ROUNDS[m.round].every(function(x){return m.matched[x]})){if(!m.roundMist)tick();if(m.round===3)W.done[1]=true}}
  else{m.mist[m.sel]=(m.mist[m.sel]||0)+1;m.flash=[m.sel,i];if(!m.roundMist)brk();m.roundMist=true;m.sel=null}
  break}
 case 'mnext':{var mm=W.match;if(mm.round<3){mm.round++;mm.sel=null;mm.roundMist=false}else{W.step=2}pendingScroll='#subnav';break}
 case 'gapchip':gapChip(getG(d.g),+d.id);break;
 case 'gapclick':gapClick(getG(d.g),i);break;
 case 'gapcheck':{
  var g=getG(d.g),res=gapCheck(g);
  if(d.g==='fill'){
   addXP(res.right*(res.first?10:5));
   if(res.first){if(res.wrong===0)tick();else brk()}
   if(res.done)W.done[2]=true;
  }else{
   r=curRes();
   if(res.wrong>0){r.q2.wrong++;brk()}
   if(res.done)award(r,'q2');
  }break}
 case 'ostep':{var o=curRes().q2.o;if(!o.done)placeTile(o,+d.id);break}
 case 'oslot':{var o2=curRes().q2.o;if(!o2.locked[i]&&o2.slots[i]!==null&&!o2.done)o2.slots[i]=null;break}
 case 'ocheck':{r=curRes();var rs=ordCheck(r.q2.o);if(rs.wrong>0){r.q2.wrong++;brk()}if(rs.done)award(r,'q2');break}
 case 'stile':{var S=W.spell,c=S.cur;if(c.solved)break;placeTile(c,+d.id);if(c.slots.every(function(x){return x!==null}))spellCheck(c);break}
 case 'sslot':{var c2=W.spell.cur;if(c2.solved||c2.locked[i]||c2.slots[i]===null)break;c2.slots[i]=null;break}
 case 'sclear':{var c3=W.spell.cur;c3.slots=c3.slots.map(function(x,k){return c3.locked[k]?x:null});break}
 case 'shint':{var c4=W.spell.cur;if(c4.hint||c4.solved)break;c4.hint=true;
  var first=c4.word.charAt(0),used={};c4.slots.forEach(function(x,k){if(x!==null&&k!==0)used[x]=1});
  var t=c4.tiles.filter(function(x){return x.c===first&&!used[x.id]})[0];
  c4.slots[0]=t.id;c4.locked[0]=true;
  c4.slots=c4.slots.map(function(x,k){return (k>0&&x===t.id)?null:x});break}
 case 'snext':{var S2=W.spell;if(S2.i===9){S2.fin=true;W.done[3]=true}else{S2.i++;S2.cur=spellInit(S2.i)}pendingScroll='#subnav';break}
 case 'goto':C.i=i;pendingScroll='.rail';break;
 case 'next':if(C.i<SC.length-1){C.i++;pendingScroll='.rail'}else{view='res';pendingScroll='.tabs'}break;
 case 'hint':r=curRes();r[d.q].hint=true;G.hints++;gain(r,-5);break;
 case 'pick1':{r=curRes();var opt=SC[C.i].o.filter(function(x){return x.k===d.t})[0];
  r.q1.picked.push(d.t);
  if(opt.ok)award(r,'q1');else{r.q1.wrong++;brk()}break}
 case 'pick2':{r=curRes();var op=r.q2.opts[i];r.q2.picked.push(i);
  if(op.ok)award(r,'q2');else{r.q2.wrong++;brk()}break}
 }
 render();
});
reset();render();
})();
</script>

</body></html>
