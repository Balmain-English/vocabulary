<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#20334a">
  <meta name="description" content="Vocabulary exercises in the Balmain English Learning Library.">
  <title>Vocabulary | Balmain English Learning Library</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20334a;
      --accent: #795b36;
      --accent-dark: #614729;
      --paper: #f5f3ed;
      --surface: #fffefa;
      --muted: #64707a;
      --line: #d9d8d1;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; scroll-behavior: smooth; }
    body { min-height: 100vh; margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.45 "Segoe UI", Arial, sans-serif; }
    .shell { width: min(1380px, calc(100% - 40px)); margin-inline: auto; }
    .masthead { background: var(--ink); color: #fff; border-bottom: 3px solid var(--accent); }
    .masthead-inner { min-height: 54px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: .01em; }
    .brand-mark { display: grid; place-items: center; width: 27px; height: 27px; border: 1px solid #aeb8c1; color: #e8dfd0; font: 1rem Georgia, serif; }
    .library-label { color: #d7dce1; font-size: .78rem; }
    main { padding: 22px 0 34px; }
    .intro { padding-bottom: 15px; border-bottom: 1px solid var(--line); }
    .eyebrow { margin: 0 0 4px; color: var(--accent); font-size: .68rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; color: var(--ink); font: 600 clamp(1.65rem, 3vw, 2.1rem)/1.12 Georgia, "Times New Roman", serif; letter-spacing: -.02em; }
    .lede { max-width: 700px; margin: 6px 0 0; color: var(--muted); font-size: .86rem; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 14px 0 10px; }
    .section-title { margin: 0; font-size: .9rem; font-weight: 700; }
    .count { margin-left: 6px; color: var(--muted); font-size: .76rem; font-weight: 500; }
    .search { width: min(310px, 100%); min-height: 34px; padding: 6px 10px; border: 1px solid #c5c8c6; border-radius: 3px; background: var(--surface); color: var(--ink); font: inherit; }
    .search::placeholder { color: #737d84; }
    .search:focus { outline: 2px solid #b8a17e; outline-offset: 1px; border-color: var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; padding: 0; margin: 0; list-style: none; }
    .grid li { min-width: 0; }
    .card { display: flex; min-height: 72px; height: 100%; flex-direction: column; justify-content: space-between; gap: 7px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); box-shadow: 0 2px 5px rgba(32, 51, 74, .04); color: var(--ink); text-decoration: none; transition: background-color .12s ease, border-color .12s ease; }
    .card:link, .card:visited, .card:hover, .card:active { color: var(--ink); text-decoration: none; }
    .card:hover { border-color: #aa997f; background: #fdfbf6; }
    .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .card-title { font-size: .82rem; font-weight: 650; line-height: 1.28; overflow-wrap: anywhere; }
    .card-meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding-top: 5px; border-top: 1px solid #ecebe6; color: var(--muted); font-size: .65rem; }
    .level { flex: none; padding: 1px 5px; border: 1px solid #ded5c7; border-radius: 2px; background: #f2eee6; color: var(--accent-dark); font-size: .62rem; font-weight: 700; }
    .open { color: var(--accent-dark); font-weight: 700; white-space: nowrap; }
    .message { grid-column: 1 / -1; padding: 18px; border: 1px dashed #bfc2bd; background: rgba(255,255,255,.55); color: var(--muted); text-align: center; }
    footer { padding: 12px 0 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: .72rem; text-align: center; }
    @media (max-width: 1100px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    @media (max-width: 820px) { .shell { width: calc(100% - 32px); } .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 600px) { main { padding-top: 18px; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .toolbar { align-items: stretch; flex-direction: column; } .search { width: 100%; } }
    @media (max-width: 400px) { .grid { grid-template-columns: 1fr; } .library-label { font-size: .7rem; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="shell masthead-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true">B</span><span>Balmain English</span></div>
      <div class="library-label">Learning Library</div>
    </div>
  </header>
  <main class="shell">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">Vocabulary practice</p>
      <h1 id="page-title">Vocabulary</h1>
      <p class="lede">A focused collection of vocabulary exercises for everyday study and revision.</p>
    </section>
    <section aria-label="Vocabulary exercise directory">
      <div class="toolbar">
        <h2 class="section-title">Explore the collection <span class="count" id="count" aria-live="polite">Loading…</span></h2>
        <input id="search" class="search" type="search" placeholder="Search activities" aria-label="Search vocabulary activities">
      </div>
      <ul id="items" class="grid" aria-live="polite" aria-busy="true"></ul>
    </section>
  </main>
  <footer><div class="shell">Balmain English · Learning Library</div></footer>
  <script>
    (() => {
      const owner = 'Balmain-English', repo = 'vocabulary';
      const list = document.getElementById('items');
      const search = document.getElementById('search');
      const count = document.getElementById('count');
      let pages = [];
      const titleOf = path => path.split('/').pop().replace(/\.html?$/i, '').replace(/[-_]+/g, ' ').replace(/\s+/g, ' ').trim().replace(/\b\w/g, c => c.toUpperCase());
      const levelOf = path => {
        const match = path.match(/(?:^|[-_])(a1|a2|b1|b2|c1|c2)(?=[-_.]|$)/i);
        return match ? match[1].toUpperCase() : '';
      };
      function render() {
        const query = search.value.trim().toLowerCase();
        const visible = pages.filter(page => page.title.toLowerCase().includes(query) || page.path.toLowerCase().includes(query));
        count.textContent = `${visible.length} ${visible.length === 1 ? 'activity' : 'activities'}`;
        list.replaceChildren();
        if (!visible.length) {
          const item = document.createElement('li');
          item.className = 'message';
          item.textContent = pages.length ? 'No activities match your search.' : 'No activities are available yet.';
          list.append(item);
          return;
        }
        const fragment = document.createDocumentFragment();
        visible.forEach(page => {
          const item = document.createElement('li');
          const link = document.createElement('a');
          link.className = 'card';
          link.href = './' + page.path.split('/').map(encodeURIComponent).join('/');
          const title = document.createElement('span');
          title.className = 'card-title';
          title.textContent = page.title;
          const meta = document.createElement('span');
          meta.className = 'card-meta';
          const kind = document.createElement('span');
          kind.textContent = /quiz|test/i.test(page.title) ? 'Quiz / assessment' : 'Vocabulary';
          meta.append(kind);
          if (page.level) {
            const badge = document.createElement('span');
            badge.className = 'level';
            badge.textContent = page.level;
            meta.append(badge);
          }
          const open = document.createElement('span');
          open.className = 'open';
          open.textContent = 'Open ↗';
          meta.append(open);
          link.append(title, meta);
          item.append(link);
          fragment.append(item);
        });
        list.append(fragment);
      }
      fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/main?recursive=1`)
        .then(response => { if (!response.ok) throw new Error('Unable to load activities'); return response.json(); })
        .then(data => {
          pages = (data.tree || [])
            .filter(file => file.type === 'blob' && /\.html?$/i.test(file.path) && !/index\.html$/i.test(file.path.split('/').pop()))
            .map(file => ({ path: file.path, title: titleOf(file.path), level: levelOf(file.path) }))
            .sort((a, b) => a.title.localeCompare(b.title));
          list.setAttribute('aria-busy', 'false');
          render();
        })
        .catch(() => {
          count.textContent = 'Activities unavailable';
          list.setAttribute('aria-busy', 'false');
          const message = document.createElement('li');
          message.className = 'message';
          message.textContent = 'Unable to load activities right now. Please try again later.';
          list.replaceChildren(message);
        });
      search.addEventListener('input', render);
    })();
  </script>
</body>
</html>
